name: CopyQ AppImage (aarch64)

# 在 GitHub 官方 ARM64 runner 上原生构建 CopyQ 的 aarch64 AppImage。
# 打包拆成两步（linuxdeploy 生成 AppDir -> appimagetool 打包），便于定位失败点。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'tag / 分支名 / commit SHA'
        required: true
        default: 'v16.0.0'
      with_native_notifications:
        description: '启用 KF6 原生通知（Ubuntu 24.04 缺 KF6 包，默认关闭）'
        required: false
        default: false
        type: boolean
      debug:
        description: '开启详细日志'
        required: false
        default: true
        type: boolean
      publish_release:
        description: '构建后发布到 GitHub Release（Release 才能用镜像加速下载）'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Release 的 tag 名（默认 appimage-aarch64-<版本>）'
        required: false
        default: ''
      gh_proxy:
        description: 'GitHub 加速前缀（仅加速构建时的下载），如 https://ghfast.top/ 或 https://gh-proxy.com/'
        required: false
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: copyq-appimage-aarch64-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须与 plugin 版本同批次（官方 CopyQ workflow 用的就是 20250213 这一批）。
  # 主程序用更新的 2025xxxx 而 plugin 停留在 20250213 会因版本错配失败。
  LINUXDEPLOY_VERSION: '1-alpha-20250213-2'
  LINUXDEPLOY_PLUGIN_VERSION: '1-alpha-20250213-1'
  MINIAUDIO_VERSION: '0.11.25'
  APPIMAGETOOL_URL: 'https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage'

jobs:
  build:
    name: Build AppImage (aarch64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - name: 环境信息
        run: |
          uname -m
          lsb_release -a || true
          nproc
          df -h / /tmp || true
          ls -l /dev/fuse || echo "（无 /dev/fuse）"

      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # 放在非 fork 的空仓库时，取消注释可直接构建上游源码：
          # repository: hluk/CopyQ
          # 故意不指定 ref：fork 不复制上游 tag，直接 checkout v16.0.0 会失败
          fetch-depth: 0
          filter: blob:none
          submodules: false
          persist-credentials: false

      - name: 补齐上游 tag 并切换目标版本
        env:
          TARGET_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add upstream https://github.com/hluk/CopyQ.git 2>/dev/null || true
          git fetch --tags --force upstream 'refs/tags/*:refs/tags/*' \
            || echo "::warning::拉取上游 tag 失败，只用本地 ref"
          if git rev-parse --verify --quiet "refs/tags/$TARGET_REF" >/dev/null; then
            git checkout --force "refs/tags/$TARGET_REF"
          else
            git checkout --force "$TARGET_REF"
          fi
          echo -n "版本串: "; git describe --tags --always

      - name: 开启 ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: copyq-aarch64-appimage

      - name: 安装构建依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          for i in 1 2 3 4; do sudo apt-get update -y && break; sleep 15; done

          required="
            build-essential cmake ninja-build pkg-config
            extra-cmake-modules libxfixes-dev libxtst-dev libwayland-dev
            qt6-base-dev qt6-base-dev-tools qt6-base-private-dev
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-declarative-dev
            libqt6svg6-dev libqt6svg6
            qtkeychain-qt6-dev
            qt6-wayland libqt6waylandclient6
            wget curl ca-certificates file
          "
          optional="
            libegl-dev
            qt6-wayland-dev qt6-wayland-dev-tools
            libqca-qt6-dev libqca-qt6-2 libqca-qt6-plugins
            libfuse2t64 xvfb
          "

          echo "=== 必需包 ==="
          sudo apt-get install -y --no-install-recommends $required
          echo "=== 可选包（逐个，失败仅警告）==="
          for p in $optional; do
            sudo apt-get install -y --no-install-recommends "$p" \
              || echo "::warning::可选包 $p 安装失败，跳过"
          done

      - name: 下载 miniaudio（失败则关闭音频功能）
        id: miniaudio
        run: |
          set -e
          url="${{ inputs.gh_proxy }}https://raw.githubusercontent.com/mackron/miniaudio/${MINIAUDIO_VERSION}/miniaudio.h"
          if curl -fsSL -o src/miniaudio.h "$url" \
             && ! head -c 200 src/miniaudio.h | grep -qi '<html\|404'; then
            echo "miniaudio 下载成功"; echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::miniaudio 下载失败，将 -DWITH_AUDIO=OFF"
            rm -f src/miniaudio.h
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置并编译
        run: |
          set -eo pipefail
          ${{ inputs.debug && 'set -x' || '' }}
          audio_flag="${{ steps.miniaudio.outputs.ok == 'true' && '-DWITH_AUDIO=ON' || '-DWITH_AUDIO=OFF' }}"
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DWITH_APPIMAGE=ON \
            -DWITH_TESTS=OFF \
            -DWITH_NATIVE_NOTIFICATIONS=${{ inputs.with_native_notifications && 'ON' || 'OFF' }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            $audio_flag
          cmake --build build --parallel "$(nproc)"

      - name: 安装到 AppDir
        run: |
          set -e
          DESTDIR="$GITHUB_WORKSPACE/AppDir" cmake --install build

      - name: 预检 AppDir
        id: precheck
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          echo "=== AppDir 顶层 ==="
          ls -la AppDir || { echo "::error::AppDir 不存在"; exit 1; }

          echo "=== usr/bin ==="
          ls -la AppDir/usr/bin | head -n 20
          [ -x AppDir/usr/bin/copyq ] || { echo "::error::AppDir/usr/bin/copyq 缺失"; exit 1; }

          echo "=== applications 目录 ==="
          ls -la AppDir/usr/share/applications || echo "（缺失）"
          desktop="$(find AppDir/usr/share/applications -name '*.desktop' 2>/dev/null | head -n1)"
          [ -n "$desktop" ] || { echo "::error::找不到 .desktop 文件"; exit 1; }
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

          icon="$(find AppDir/usr/share/icons -name 'copyq*.svg' -o -name 'copyq*.png' 2>/dev/null | head -n1)"
          if [ -n "$icon" ]; then echo "icon=$icon" >> "$GITHUB_OUTPUT"; fi

          echo "desktop 文件: $desktop"
          echo "图标文件: ${icon:-（未找到，跳过图标参数）}"

      - name: 取得版本号
        id: version
        run: |
          version="$(git describe --tags --always | sed 's/^v//')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "构建版本: $version"

      - name: 准备打包工具链（aarch64，FUSE 自动兜底）
        run: |
          set -e
          dest="$HOME/.local/bin"
          mkdir -p "$dest"
          base_ld="https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}"
          base_qt="https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_PLUGIN_VERSION}"

          proxy="${{ inputs.gh_proxy }}"
          [ -n "$proxy" ] && echo "使用加速前缀: $proxy"
          wget -q -O "$dest/linuxdeploy.bin"                 "${proxy}${base_ld}/linuxdeploy-aarch64.AppImage"
          wget -q -O "$dest/linuxdeploy-plugin-qt.bin"       "${proxy}${base_qt}/linuxdeploy-plugin-qt-aarch64.AppImage"
          wget -q -O "$dest/appimagetool.bin"                "${proxy}${APPIMAGETOOL_URL}"
          chmod +x "$dest"/*.bin
          # 校验确实下载到了 AppImage（HTML 错误页会导致后续莫名其妙的失败）
          for f in "$dest"/*.bin; do
            file "$f" | grep -qi 'ELF\|executable' \
              || { echo "::error::$f 不是有效可执行文件，下载可能被代理拦下了"; head -c 200 "$f"; exit 1; }
          done

          # 无 FUSE 时改为 --appimage-extract-and-run 包装运行
          if [ -e /dev/fuse ] && "$dest/linuxdeploy.bin" --help >/dev/null 2>&1; then
            echo "AppImage 可直接运行（检测到 FUSE）"
            for t in linuxdeploy linuxdeploy-plugin-qt appimagetool; do
              mv "$dest/$t.bin" "$dest/$t"
            done
          else
            echo "::warning::无可用 FUSE，改用 --appimage-extract-and-run 包装"
            for t in linuxdeploy linuxdeploy-plugin-qt appimagetool; do
              printf '#!/bin/sh\nexec "%s/%s.bin" --appimage-extract-and-run "$@"\n' "$dest" "$t" > "$dest/$t"
              chmod +x "$dest/$t"
            done
          fi

          echo "$dest" >> "$GITHUB_PATH"
          command -v linuxdeploy && command -v appimagetool

      - name: 生成 AppDir（linuxdeploy + Qt 插件）
        id: deploy
        env:
          EXTRA_QT_MODULES: svg;tls
          # 注意：不要再写死 libqwayland.so —— Qt6 已拆分为
          # libqwayland-generic.so / libqwayland-egl.so，写死会导致
          # "Cannot deploy non-existing library file" 并 exit 1。
          # 实际值在下方按文件名自动探测后 export。
          QMAKE: qmake6
          VERSION: ${{ steps.version.outputs.version }}
          DEBUG: '1'
        run: |
          set -eo pipefail
          ${{ inputs.debug && 'set -x' || '' }}
          APPDIR="$GITHUB_WORKSPACE/AppDir"

          command -v linuxdeploy || { echo "::error::linuxdeploy 不在 PATH"; exit 1; }
          command -v linuxdeploy-plugin-qt || { echo "::error::linuxdeploy-plugin-qt 不在 PATH"; exit 1; }
          command -v qmake6 || { echo "::error::qmake6 不在 PATH"; exit 1; }
          linuxdeploy --version || true

          qt_plugins="$(qmake6 -query QT_INSTALL_PLUGINS)"
          echo "Qt 插件目录: $qt_plugins"
          echo "platforms 目录内容:"; ls "$qt_plugins/platforms"

          # 自动探测 wayland 平台插件真实文件名（Qt6 不再有 libqwayland.so）
          wayland_plugins=""
          for so in "$qt_plugins"/platforms/libqwayland*.so; do
            [ -e "$so" ] || continue
            wayland_plugins="${wayland_plugins:+$wayland_plugins;}$(basename "$so")"
          done
          if [ -n "$wayland_plugins" ]; then
            export EXTRA_PLATFORM_PLUGINS="$wayland_plugins"
            echo "额外平台插件: $EXTRA_PLATFORM_PLUGINS"
          else
            echo "::warning::未找到 wayland 平台插件，跳过（AppImage 将只用 X11/XWayland）"
          fi

          deps_only_flags=()
          for dir in \
              kf6/kwindowsystem \
              wayland-shell-integration \
              wayland-decoration-client \
              wayland-graphics-integration-client \
          ; do
              src="$qt_plugins/$dir"; dst="$APPDIR/usr/plugins/$dir"
              if [ -d "$src" ]; then
                  mkdir -p "$dst"; cp -a "$src"/*.so "$dst/" 2>/dev/null || true
                  deps_only_flags+=(--deploy-deps-only "$dst")
              fi
          done

          mkdir -p "$APPDIR/usr/plugins/crypto"
          qca_ossl=$(find /usr/lib /usr/lib64 /usr/lib/aarch64-linux-gnu \
              -name 'libqca-ossl.so' -print -quit 2>/dev/null)
          if [ -n "$qca_ossl" ]; then
              cp -a "$qca_ossl" "$APPDIR/usr/plugins/crypto/"
              deps_only_flags+=(--deploy-deps-only "$APPDIR/usr/plugins/crypto")
          else
              echo "::warning::未找到 libqca-ossl.so，加密标签功能可能不可用"
          fi

          icon="${{ steps.precheck.outputs.icon }}"
          if linuxdeploy --appdir "$APPDIR" \
            --desktop-file "${{ steps.precheck.outputs.desktop }}" \
            ${icon:+--icon-file "$icon"} \
            --executable "$APPDIR/usr/bin/copyq" \
            "${deps_only_flags[@]}" \
            --plugin qt 2>&1 | tee linuxdeploy.log; then
            echo "linuxdeploy 成功"
          else
            # 日志直接打到页面，无需下载 artifact
            {
              echo "### ❌ linuxdeploy 失败"
              echo ""
              echo "**linuxdeploy 版本**：$(linuxdeploy --version 2>&1 | head -n1)"
              echo "**架构**：$(uname -m)"
              echo ""
              echo '```'
              tail -n 80 linuxdeploy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::linuxdeploy 失败，日志尾部如下："
            tail -n 80 linuxdeploy.log
            exit 1
          fi
          echo "--- AppDir 生成后 ---"
          ls -la "$APPDIR"

      - name: 降级：手动部署 Qt 依赖（仅当上一步失败时）
        id: fallback
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          set -eo pipefail
          APPDIR="$GITHUB_WORKSPACE/AppDir"
          echo "::warning::--plugin qt 失败，改用手动部署 Qt 依赖"

          if ! linuxdeploy --appdir "$APPDIR" \
            --desktop-file "${{ steps.precheck.outputs.desktop }}" \
            --executable "$APPDIR/usr/bin/copyq" 2>&1 | tee linuxdeploy.log; then
            echo "::warning::linuxdeploy 基础部署也失败了，继续手动补齐"
          fi

          mkdir -p "$APPDIR/usr/lib" "$APPDIR/usr/plugins"
          qt_plugins="$(qmake6 -query QT_INSTALL_PLUGINS)"

          for d in platforms imageformats iconengines tls sqldrivers platformthemes \
                   wayland-shell-integration wayland-decoration-client \
                   wayland-graphics-integration-client; do
            if [ -d "$qt_plugins/$d" ]; then cp -a "$qt_plugins/$d" "$APPDIR/usr/plugins/" || true; fi
          done

          # 迭代拷贝 Qt/KF6/ICU 依赖。
          # 注意：先把清单落盘再用 while 读，避免 `ldd | grep` 无匹配时
          # 在 set -eo pipefail 下直接中断。
          for round in 1 2 3; do
            : > /tmp/elf.list
            for base in "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/plugins"; do
              [ -d "$base" ] || continue
              find "$base" -type f -print >> /tmp/elf.list 2>/dev/null || true
            done
            while read -r f; do
              [ -f "$f" ] || continue
              file "$f" | grep -q ELF || continue
              ldd "$f" > /tmp/ldd.txt 2>/dev/null || true
              grep -o '/[^ ]*\.so[^ ]*' /tmp/ldd.txt > /tmp/libs.txt || true
              while read -r lib; do
                [ -f "$lib" ] || continue
                case "$lib" in
                  */libQt6*|*/libqca*|*/libicu*|*/libKF6*|*/libqgpgme*)
                    dst="$APPDIR/usr/lib/$(basename "$lib")"
                    [ -e "$dst" ] || cp -a "$lib" "$dst" 2>/dev/null || true
                    ;;
                esac
              done < /tmp/libs.txt
            done < /tmp/elf.list
          done

          # 告诉 Qt 去哪儿找插件（AppImage 标准布局）。
          # 用 printf 而非 heredoc：YAML 缩进会污染 heredoc 内容导致 INI 解析失败。
          printf '[Paths]\nPrefix = ..\nPlugins = plugins\nLibraries = lib\n' \
            > "$APPDIR/usr/bin/qt.conf"
          cat "$APPDIR/usr/bin/qt.conf"

          echo "Qt 插件："; ls "$APPDIR/usr/plugins"
          echo "已收集库数量：$(ls "$APPDIR/usr/lib" | wc -l)"

      - name: 打包成 AppImage（appimagetool）
        id: package
        if: steps.deploy.outcome == 'success' || steps.fallback.outcome == 'success'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: aarch64
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "=== AppDir 顶层（打包前）==="; ls -la AppDir
          [ -f AppDir/AppRun ] || echo "::warning::AppDir/AppRun 不存在"
          out="CopyQ-${VERSION}-aarch64.AppImage"
          if ! appimagetool AppDir "$out" 2>&1 | tee appimagetool.log; then
            echo "::error::appimagetool 打包失败"
            echo "--- AppRun ---"; ls -la AppDir/AppRun 2>/dev/null || echo "AppRun 缺失"
            echo "--- .DirIcon ---"; ls -la AppDir/.DirIcon 2>/dev/null || echo ".DirIcon 缺失"
            echo "--- desktop ---"; ls -la AppDir/*.desktop 2>/dev/null || echo "根目录 desktop 缺失"
            echo "--- 磁盘 ---"; df -h / /tmp
            exit 1
          fi
          ls -la "$out"
          echo "name=$out" >> "$GITHUB_OUTPUT"

      - name: 冒烟测试
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          chmod +x "${{ steps.package.outputs.name }}"
          xvfb-run -a "./${{ steps.package.outputs.name }}" --version \
            || "./${{ steps.package.outputs.name }}" --version

      - name: 上传 AppImage
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CopyQ-aarch64-AppImage
          path: CopyQ-*.AppImage
          archive: false

      - name: 发布到 GitHub Release（可用镜像加速下载）
        if: inputs.publish_release && steps.package.outputs.name != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          appimage="${{ steps.package.outputs.name }}"
          version="${{ steps.version.outputs.version }}"
          tag="${{ inputs.release_tag }}"
          [ -n "$tag" ] || tag="appimage-aarch64-$version"
          echo "发布到 tag: $tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$appimage" --clobber
          else
            gh release create "$tag" "$appimage" \
              --target "$GITHUB_SHA" \
              --title "CopyQ $version (aarch64 AppImage)" \
              --notes "由 GitHub Actions 自动构建的 aarch64 AppImage，源码版本 \`$version\`。"
          fi

          url="$(gh release view "$tag" --json url --jq '.url')"
          echo "### ✅ 已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "Release： $url" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "下载直链见上方 Release 页面，可配合 gh-proxy 等镜像加速。"
          echo "已发布: $url"

      - name: 上传日志（始终）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: |
            linuxdeploy.log
            appimagetool.log
          if-no-files-found: ignore
